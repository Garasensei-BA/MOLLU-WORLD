name: 미래시 자동 업데이트

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: write

jobs:
  update-future:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 미래시 업데이트 실행
        run: python update_future.py

      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add future-data.json
          git diff --cached --quiet || git commit -m "자동 미래시 업데이트"
          git push
